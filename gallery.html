<script type="module">
        import { auth, db } from './src/firebase.js';
        import { signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const loginSection = document.getElementById('login-section');
        const uploadSection = document.getElementById('upload-section');

        // 1. 로그인 상태 모니터링
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.style.display = 'none';
                uploadSection.style.display = 'block';
            } else {
                loginSection.style.display = 'block';
                uploadSection.style.display = 'none';
            }
        });

        // 2. 로그인 실행
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert('로그인 성공');
            } catch (error) {
                alert('아이디와 비밀번호가 일치하지 않습니다.');
            }
        });

        // 3. 로그아웃
        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        // 4. 사진 업로드 (Cloudinary + Firestore)
        document.getElementById('uploadBtn').addEventListener('click', async () => {
            const file = document.getElementById('photo-input').files[0];
            const title = document.getElementById('photo-title').value;
            
            if (!file || !title) return alert('사진과 제목을 모두 입력해야 해!');

           // ... 기존 코드 (onAuthStateChanged 등) 유지 ...

// 4. 사진 업로드 실행 (Cloudinary 전송 -> Firestore 기록)
document.getElementById('uploadBtn').addEventListener('click', async () => {
    const fileInput = document.getElementById('photo-input');
    const titleInput = document.getElementById('photo-title');
    const file = fileInput.files[0];
    const title = titleInput.value;
    
    if (!file || !title) return alert('사진과 제목을 모두 입력해야 해!');

    // 버튼 비활성화 (중복 클릭 방지)
    const uploadBtn = document.getElementById('uploadBtn');
    uploadBtn.disabled = true;
    uploadBtn.innerText = '업로드 중...';

    try {
        // [A] Cloudinary에 사진 전송
        const cloudName = 'dhzbbdllh'; // ⚠️ 메모장 확인!
        const uploadPreset = 'unsigned_preset'; // ⚠️ 메모장 확인!
        
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', uploadPreset);

        const cloudinaryResponse = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
            method: 'POST',
            body: formData
        });

        const cloudData = await cloudinaryResponse.json();
        const imageUrl = cloudData.secure_url; // 업로드된 사진의 진짜 주소!

        if (!imageUrl) throw new Error('Cloudinary 업로드 실패');

        // [B] Firestore에 게시글 정보 저장
        await addDoc(collection(db, "activities"), {
            title: title,
            imageUrl: imageUrl,
            createdAt: serverTimestamp()
        });

        alert('활동 기록이 성공적으로 등록됐어! 🎉');
        
        // 입력창 초기화
        fileInput.value = '';
        titleInput.value = '';
        
    } catch (error) {
        console.error(error);
        alert('업로드 중 문제가 생겼어. 설정을 다시 확인해봐.');
    } finally {
        uploadBtn.disabled = false;
        uploadBtn.innerText = '업로드 실행';
    }
});
        });
    </script>
