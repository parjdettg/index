<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/styles.css">
    <title>활동기록 - 진주초원 사회적협동조합</title>
</head>

<body class="page-gallery">
    <header class="main-header">
        <div class="nav-container">
            <a href="index.html" class="logo">
                진주초원 사회적협동조합
                <span class="en-logo-text">JINJU MEADOW SOCIAL COOPERATIVE</span>
            </a>
            <nav class="nav-menu">
                <a href="about.html">조합소개</a>
                <a href="disclosure.html">정보공개</a>
                <a href="business.html">주요사업</a>
                <a href="gallery.html" style="color: #2c5f2d; font-weight: bold;">활동기록</a>
                <a href="index.html#contact">참여/신고</a>
            </nav>
        </div>
    </header>

    <section class="activity-section">
        <div class="container">
            <div class="section-title">
                <h2>활동기록</h2>
                <p><strong>진주초원이 지역사회와 함께한 따뜻한 동행의 기록입니다.</strong></p>
            </div>

            <div id="admin-container" class="container" style="margin-bottom: 40px; text-align: center; background: #f9f9f9; padding: 20px; border-radius: 10px;">
                <div id="login-section">
                    <p style="margin-bottom: 10px; color: #666;">관리자 권한이 필요한 기능이야.</p>
                    <input type="email" id="admin-email" placeholder="이메일" style="padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                    <input type="password" id="admin-password" placeholder="비밀번호" style="padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                    <button id="loginBtn" class="btn-load-more" style="width: auto; padding: 10px 25px; margin-left: 10px;">로그인</button>
                </div>

                <div id="upload-section" style="display: none; border: 2px dashed #2c5f2d; padding: 20px; border-radius: 8px;">
                    <h3 style="color: #2c5f2d; margin-bottom: 15px;">✨ 활동 사진 등록 모드</h3>
                    <input type="file" id="photo-input" accept="image/*" style="margin-bottom: 15px;">
                    <input type="text" id="photo-title" placeholder="활동 제목을 적어줘." style="width: 100%; padding: 10px; margin-bottom: 10px;">
                    <button id="uploadBtn" class="btn-load-more" style="width: auto; padding: 10px 25px; background: #2c5f2d;">업로드 실행</button>
                    <button id="logoutBtn" style="background: none; border: none; color: #999; text-decoration: underline; cursor: pointer; margin-left: 15px;">로그아웃</button>
                </div>
            </div>

            <div class="project-list" id="gallery-grid"></div>

            <div class="load-more-container">
                <button id="loadMoreBtn" class="btn-load-more">
                    활동 더 보기 <span style="font-size:12px;">▼</span>
                </button>
            </div>
        </div>
    </section>

    <section class="partners-section">
        <div class="container link-container">
            <a href="https://www.hometax.go.kr/" target="_blank" class="partner-item">
                <img src="images/Tax.jpg" alt="국세청" class="logo-img">
            </a>
            <a href="https://www.acrc.go.kr/" target="_blank" class="partner-item">
                <img src="images/cor1.png" alt="국민권익위원회" class="logo-img">
            </a>
            <a href="https://www.gyeongnam.go.kr/" target="_blank" class="partner-item">
                <img src="images/gyn.png" alt="경상남도" class="logo-img">
            </a>
        </div>
    </section>

    <footer>
        <div class="container footer-info">
            <p>대표자 : 이기성 <span class="info-divider">|</span> 고유번호 : 177-82-00816</p>
            <p>주소 : 경상남도 진주시 명석면 광제산로 837번길 32-38</p>
            <p class="copyright">Copyright &copy; 2025 진주초원 사회적협동조합 All Rights Reserved.</p>
        </div>
    </footer>

    <script type="module">
        import { auth, db } from './src/firebase.js';
        import { signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, addDoc, serverTimestamp, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const loginSection = document.getElementById('login-section');
        const uploadSection = document.getElementById('upload-section');

        // 1. 로그인 상태 모니터링 및 UI 전환
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.style.display = 'none';
                uploadSection.style.display = 'block';
            } else {
                loginSection.style.display = 'block';
                uploadSection.style.display = 'none';
            }
        });

        // 2. 로그인 실행
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert('로그인 성공!');
            } catch (error) {
                console.error("에러 상세 코드:", error.code);
                alert('실패 코드: ' + error.code);
            }
        });

        // 3. 로그아웃
        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        // 4. 사진 업로드 (Cloudinary + Firestore)
        document.getElementById('uploadBtn').addEventListener('click', async () => {
            const file = document.getElementById('photo-input').files[0];
            const title = document.getElementById('photo-title').value;
            
            if (!file || !title) return alert('사진과 제목을 모두 입력해야 해!');

            const uploadBtn = document.getElementById('uploadBtn');
            uploadBtn.disabled = true;
            uploadBtn.innerText = '처리 중...';

            try {
                // Cloudinary 설정 (실제 값 반영)
                const cloudName = 'dhzbbdllh'; // 👈 '네_클라우드_네임' 대신 이걸 정확히 써야 해!
const uploadPreset = 'unsigned_preset'; // 👈 오타 없는지 꼭 확인!

const formData = new FormData();
formData.append('file', file);
formData.append('upload_preset', uploadPreset);

// URL 주소에 오타가 없는지도 확인해줘!
const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
    method: 'POST',
    body: formData
});
                const data = await res.json();

                if (!data.secure_url) throw new Error('이미지 주소 획득 실패');

                // Firestore 저장
                await addDoc(collection(db, "activities"), {
                    title: title,
                    imageUrl: data.secure_url,
                    createdAt: serverTimestamp()
                });

                alert('기록이 성공적으로 축적됐다!');
                document.getElementById('photo-input').value = '';
                document.getElementById('photo-title').value = '';
            } catch (e) {
                alert('에러 발생: ' + e.message);
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.innerText = '업로드 실행';
            }
        });

        // 5. 실시간 갤러리 데이터 불러오기
        const q = query(collection(db, "activities"), orderBy("createdAt", "desc"));

        onSnapshot(q, (snapshot) => {
    const galleryGrid = document.getElementById('gallery-grid');
    if (!galleryGrid) return;
    
    galleryGrid.innerHTML = ''; // 기존 내용을 비움

    snapshot.forEach((doc) => {
        const item = doc.data();
        const dateStr = item.createdAt?.toDate().toLocaleDateString('ko-KR') || '방금 전';
        
        // ★ 기존 gallery.js의 HTML 구조를 그대로 복사해서 넣었어!
        const html = `
            <div class="project-card">
                <div class="gallery-container">
                    <div class="main-view">
                        <img src="${item.imageUrl}" alt="${item.title}">
                    </div>
                </div>
                <div class="project-info">
                    <h3 class="project-title" style="color:#2c5f2d;">${item.title}</h3>
                    <div class="project-meta">
                        <span><strong>일시:</strong> ${dateStr}</span>
                        <span><strong>장소:</strong> 진주초원 사회적협동조합</span>
                    </div>
                    <p class="project-desc">관리자가 실시간으로 등록한 활동 소식입니다.</p>
                    <div class="project-tags">
                        <span>#진주초원</span><span>#실시간업데이트</span>
                    </div>
                </div>
            </div>
        `;
        galleryGrid.innerHTML += html;
    });
});

    </script>
    <script src="js/gallery.js"></script>
</body>
</html>
