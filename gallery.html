<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/styles.css">
    <title>활동기록 - 진주초원 사회적협동조합</title>
</head>

<body class="page-gallery">
    <header class="main-header">
        <div class="nav-container">
            <a href="index.html" class="logo">
                진주초원 사회적협동조합
                <span class="en-logo-text">JINJU MEADOW SOCIAL COOPERATIVE</span>
            </a>
            <nav class="nav-menu">
                <a href="about.html">조합소개</a>
                <a href="disclosure.html">정보공개</a>
                <a href="business.html">주요사업</a>
                <a href="gallery.html" style="color: #2c5f2d; font-weight: bold;">활동기록</a>
                <a href="index.html#contact">참여/신고</a>
            </nav>
        </div>
    </header>

    <section class="activity-section">
        <div class="container">
            <div class="section-title">
                <h2>활동기록</h2>
                <p><strong>진주초원이 지역사회와 함께한 따뜻한 동행의 기록입니다.</strong></p>
            </div>

            <div id="admin-container" class="container" style="margin-bottom: 40px; text-align: center; background: #f9f9f9; padding: 20px; border-radius: 10px;">

                <div class="admin-auth-area">
    <button id="openAuthModal" class="btn-modern-outline">Admin Access</button>
</div>

<div id="authModal" class="modal-overlay">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <div id="authHeader">
            <h2 id="modalTitle">관리자 로그인</h2>
            <p id="modalSubTitle">접근을 위해 입력하십시오.</p>
        </div>
        
        <div class="auth-fields">
            <input type="email" id="authEmail" placeholder="Email Address">
            <input type="password" id="authPassword" placeholder="Password">
        </div>
        
        <button id="executeAuthBtn" class="btn-full">로그인 실행</button>
        
        <div class="auth-switcher">
            <p id="toggleMsg">계정이 없으신가요? <span id="switchBtn">회원가입</span></p>
        </div>
    </div>
</div>

                <div id="upload-section" style="display:none; margin: 20px 0; padding: 20px; border: 1px dashed #2c5f2d; border-radius: 15px;">
    <h3>✨ 활동 사진 등록 모드</h3>
    <input type="file" id="photo-input" accept="image/*" style="margin-bottom:10px;">
    <input type="text" id="photo-title" placeholder="제목을 입력해줘" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px;">
    <textarea id="photo-desc" placeholder="내용을 입력해줘" style="width:100%; height:100px; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px;"></textarea>
    <button id="uploadBtn" class="btn-full">업로드 실행</button>
</div>
            </div>

            <div class="project-list" id="gallery-grid"></div>

            <div class="load-more-container">
                <button id="loadMoreBtn" class="btn-load-more">
                    활동 더 보기 <span style="font-size:12px;">▼</span>
                </button>
            </div>
        </div>
    </section>

    <section class="partners-section">
        <div class="container link-container">
            <a href="https://www.hometax.go.kr/" target="_blank" class="partner-item">
                <img src="images/Tax.jpg" alt="국세청" class="logo-img">
            </a>
            <a href="https://www.acrc.go.kr/" target="_blank" class="partner-item">
                <img src="images/cor1.png" alt="국민권익위원회" class="logo-img">
            </a>
            <a href="https://www.gyeongnam.go.kr/" target="_blank" class="partner-item">
                <img src="images/gyn.png" alt="경상남도" class="logo-img">
            </a>
        </div>
    </section>

    <footer>
        <div class="container footer-info">
            <p>대표자 : 이기성 <span class="info-divider">|</span> 고유번호 : 177-82-00816</p>
            <p>주소 : 경상남도 진주시 명석면 광제산로 837번길 32-38</p>
            <p class="copyright">Copyright &copy; 2025 진주초원 사회적협동조합 All Rights Reserved.</p>
        </div>
    </footer>

    <script type="module">
        import { auth, db } from './src/firebase.js';
        import { createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, addDoc, serverTimestamp, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

       // 1. UI 요소 가져오기
        const authModal = document.getElementById('authModal');
        const uploadSection = document.getElementById('upload-section');
        const openAuthModalBtn = document.getElementById('openAuthModal');
        const executeBtn = document.getElementById('executeAuthBtn');
        const switchBtn = document.getElementById('switchBtn');
        const modalTitle = document.getElementById('modalTitle');
        let signUpMode = false;

        // 2. 로그인 상태 감지 (UI 전환)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // 로그인 완료 시
                uploadSection.style.display = 'block';
                openAuthModalBtn.innerText = 'Logout';
                openAuthModalBtn.onclick = () => {
                    if(confirm('로그아웃 하시겠습니까?')) signOut(auth).then(() => location.reload());
                };
            } else {
                // 로그아웃 상태 시
                uploadSection.style.display = 'none';
                openAuthModalBtn.innerText = 'Admin Access';
                openAuthModalBtn.onclick = () => authModal.style.display = 'flex';
            }
        });

        // 3. 모달 제어 및 엔터키 로그인
        document.querySelector('.close-modal').onclick = () => authModal.style.display = 'none';

        // ★ 엔터키 입력 시 로그인 실행 (비밀번호 칸에서 작동)
        document.getElementById('authPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') executeBtn.click();
        });

        // 회원가입/로그인 모드 전환
        switchBtn.onclick = () => {
            signUpMode = !signUpMode;
            modalTitle.innerText = signUpMode ? '관리자 회원가입' : '관리자 로그인';
            executeBtn.innerText = signUpMode ? '가입하기' : '로그인 실행';
            document.getElementById('toggleMsg').innerHTML = signUpMode 
                ? '이미 계정이 있나요? <span id="switchBtn" style="color:#2c5f2d; cursor:pointer; font-weight:bold;">로그인</span>' 
                : '계정이 없으신가요? <span id="switchBtn" style="color:#2c5f2d; cursor:pointer; font-weight:bold;">회원가입</span>';
            document.getElementById('switchBtn').onclick = switchBtn.onclick;
        };

        // 실제 인증 실행
        executeBtn.onclick = async () => {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            if(!email || !password) return alert('정보 입력');

            try {
                if (signUpMode) {
                    await createUserWithEmailAndPassword(auth, email, password);
                    alert('가입 성공');
                    location.reload();
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    alert('인증 성공');
                    authModal.style.display = 'none';
                }
            } catch (err) {
                alert('에러: ' + err.code);
            }
        };

        // 4. 활동 기록 업로드 (내용 + 날짜 자동 포함)
        document.getElementById('uploadBtn').onclick = async () => {
            const file = document.getElementById('photo-input').files[0];
            const title = document.getElementById('photo-title').value;
            const desc = document.getElementById('photo-desc').value; // 내용 가져오기

            if (!file || !title || !desc) return alert('사진, 제목, 내용을 모두 채워줘!');

            const uploadBtn = document.getElementById('uploadBtn');
            uploadBtn.disabled = true;
            uploadBtn.innerText = '전송 중...';

            try {
                // Cloudinary 업로드
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', 'unsigned_preset');
                
                const res = await fetch(`https://api.cloudinary.com/v1_1/dhzbbdllh/image/upload`, {
                    method: 'POST',
                    body: formData
                });
                const cloudData = await res.json();

                // Firestore 저장 (날짜 Automatic 기록)
                await addDoc(collection(db, "activities"), {
                    title: title,
                    desc: desc,
                    imageUrl: cloudData.secure_url,
                    createdAt: serverTimestamp() 
                });

                alert('등록 완료!');
                location.reload();
            } catch (e) {
                alert('업로드 실패: ' + e.message);
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.innerText = '업로드 실행';
            }
        };

        // 5. 실시간 갤러리 데이터 불러오기
        const q = query(collection(db, "activities"), orderBy("createdAt", "desc"));

        onSnapshot(q, (snapshot) => {
    const galleryGrid = document.getElementById('gallery-grid');
    if (!galleryGrid) return;
    
    galleryGrid.innerHTML = ''; // 기존 내용을 비움

    snapshot.forEach((doc) => {
        const item = doc.data();
        const dateStr = item.createdAt?.toDate().toLocaleDateString('ko-KR') || '방금 전';
        
        // ★ 기존 gallery.js의 HTML 구조를 그대로 복사해서 넣었어!
        const html = `
            <div class="project-card">
                <div class="gallery-container">
                    <div class="main-view">
                        <img src="${item.imageUrl}" alt="${item.title}">
                    </div>
                </div>
                <div class="project-info">
                    <h3 class="project-title" style="color:#2c5f2d;">${item.title}</h3>
                    <div class="project-meta">
                        <span><strong>일시:</strong> ${dateStr}</span>
                        <span><strong>장소:</strong> 진주초원 사회적협동조합</span>
                    </div>
                    <p class="project-desc">관리자가 실시간으로 등록한 활동 소식입니다.</p>
                    <div class="project-tags">
                        <span>#진주초원</span><span>#실시간업데이트</span>
                    </div>
                </div>
            </div>
        `;
        galleryGrid.innerHTML += html;
    });
});

    </script>
    <script src="js/gallery.js"></script>
</body>
</html>
